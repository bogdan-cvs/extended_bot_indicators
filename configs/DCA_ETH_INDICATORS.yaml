# =============================================================================
# DCA Bot Profile - ETH-USD with Technical Indicators
# =============================================================================
# Dollar Cost Averaging (DCA) strategy with indicator-based entry signals.
# Uses RSI, MACD, Bollinger Bands, and EMA for entry confirmation.
#
# Strategy: PERMISSIVE (2 out of 4 indicators must confirm)
# =============================================================================

# Mode of operation
dry_run: false
log_level: "INFO"
metrics_interval_sec: 60

# ===== DCA STRATEGY PARAMETERS =====
dca:
  # Direction: LONG (buy dips) or SHORT (sell rallies)
  direction: "LONG"

  # Market to trade
  market: "ETH-USD"

  # Base order - initial position entry
  # $75 position = $5 margin at 15x leverage
  base_order_size_usd: 75.0

  # Safety orders (SO) - average down on dips
  max_safety_orders: 4

  # First safety order size (USD)
  safety_order_size_usd: 90.0

  # Price deviation to trigger first safety order (%)
  price_deviation_pct: 0.25

  # Safety order step scale (multiplier for distance between SOs)
  safety_order_step_scale: 1.0

  # Safety order volume scale (multiplier for SO size)
  safety_order_volume_scale: 1.2

  # Take profit target (% from average entry price)
  # 2.5% TP for indicator-based entries (higher confidence)
  take_profit_pct: 2.5

  # Trailing take profit (follow price up)
  trailing_take_profit: false
  trailing_deviation_pct: 0.5

  # Stop loss (% from average entry, 0 = disabled)
  # 2.5% SL for 1:1 risk:reward ratio
  stop_loss_pct: 2.5

  # Entry conditions
  start_immediately: false  # Wait for indicator signal

  # Cooldown after trade completes (seconds)
  cooldown_between_trades_sec: 60.0

  # Re-entry refresh: if base order not filled, update to current price (seconds)
  entry_refresh_seconds: 60.0

# ===== INDICATOR SETTINGS =====
indicators:
  # Enable indicator-based entries
  enabled: true

  # Strategy: "strict" (4/4 must confirm) or "permissive" (2/4 must confirm)
  strategy: "permissive"

  # Minimum confirmations needed (overrides strategy if set)
  # 2 = permissive, 3 = moderate, 4 = strict
  min_confirmations: 2

  # Timeframe for candles (seconds)
  # 900 = 15 minutes (recommended for DCA)
  candle_timeframe_sec: 900

  # Number of candles to fetch for indicator calculation
  # Need at least 200 for EMA200
  candles_count: 250

  # Update interval (how often to check indicators)
  update_interval_sec: 60

  # ===== RSI Settings =====
  rsi:
    enabled: true
    period: 14
    # Permissive thresholds (relaxed)
    oversold: 35.0      # LONG signal when RSI < 35
    overbought: 65.0    # SHORT signal when RSI > 65

  # ===== MACD Settings =====
  macd:
    enabled: true
    fast_period: 12
    slow_period: 26
    signal_period: 9

  # ===== Bollinger Bands Settings =====
  bollinger:
    enabled: true
    period: 20
    std_dev: 2.0

  # ===== EMA Settings =====
  ema:
    enabled: true
    period: 200

# ===== RISK PARAMETERS =====
risk:
  max_inventory_usd: 1000.0
  max_position_notional: 5000.0
  max_leverage: 20.0

  # Kill switch
  kill_switch_drawdown_usd: 30.0
  session_drawdown_pct: 20.0
  daily_drawdown_limit_usd: 50.0

# ===== ORDER EXECUTION =====
order:
  post_only: true
  use_taker_for_risk_off: true
  taker_offset_bps: 15.0
  order_expiration_sec: 3600
  cancel_before_replace: true
  max_retries: 3
  retry_delay_sec: 1.0

# =============================================================================
# STRATEGY EXPLANATION:
# =============================================================================
# PERMISSIVE STRATEGY (2 out of 4 indicators must confirm):
#
# For LONG entry, need 2 of these:
#   - RSI < 35 (oversold)
#   - MACD bullish (histogram > 0 or bullish crossover)
#   - Price at/below lower Bollinger Band
#   - Price above EMA200 (uptrend)
#
# For SHORT entry, need 2 of these:
#   - RSI > 65 (overbought)
#   - MACD bearish (histogram < 0 or bearish crossover)
#   - Price at/above upper Bollinger Band
#   - Price below EMA200 (downtrend)
#
# Benefits of permissive:
#   - More trading opportunities (5-10 trades/day)
#   - Win rate ~55-65%
#   - Good for ranging/sideways markets
#
# TP/SL: 2.5% / 2.5% = 1:1 Risk:Reward
# Win rate needed: >50%
# =============================================================================

# =============================================================================
# USAGE:
# =============================================================================
# python -m src.dca_main --env mainnet --profile DCA_ETH_INDICATORS
# =============================================================================
