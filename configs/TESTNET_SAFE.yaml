# =============================================================================
# TESTNET_SAFE Profile
# =============================================================================
# Super-conservator pentru validarea logicii pe testnet.
# Ordine mici, spread larg, pauze frecvente - ideal pentru testare.
# =============================================================================

# Mod de operare
dry_run: false  # Setează pe false după validarea inițială
log_level: "DEBUG"  # Mai verbose pentru debugging
metrics_interval_sec: 30  # Rapoarte mai frecvente pe testnet

# ===== STRATEGY PARAMETERS =====
strategy:
  # Market - va fi selectat dinamic dacă e nevoie
  # Verifică /markets endpoint pentru markets disponibile pe testnet
  market: "AAVE-USD"
  
  # Dimensiunea ordinelor (USD)
  # Minim ~$16 pentru AAVE-USD (minOrderSize=0.1, pret ~155)
  order_notional_usd: 20.0
  
  # Număr maxim de ordine per parte
  # 1 singur ordine pe fiecare parte (bid/ask)
  max_open_orders_per_side: 1
  
  # Spread (în basis points, 1 bps = 0.01%)
  # Spread larg: 30-150 bps pentru a reduce fills agresive
  spread_min_bps: 30.0      # Minim 0.30%
  spread_max_bps: 150.0     # Maxim 1.50%
  
  # Refresh interval
  # Mai rar pentru a reduce load pe testnet
  refresh_sec: 6.0
  
  # Requote pe mișcare mid price
  # Requote dacă mid se mișcă > 15 bps
  mid_move_requote_bps: 15.0
  
  # Pauză la volatilitate
  # Intră în pauză dacă mid se mișcă > 60 bps în 15 secunde
  pause_move_bps: 60.0
  pause_window_sec: 15.0
  cooldown_after_pause_sec: 45.0
  
  # Ajustare spread pe volatilitate
  # Volatilitate lookback window
  volatility_lookback_sec: 60.0
  # Multiplicator: spread crește cu X * volatilitate
  volatility_spread_multiplier: 2.0

# ===== RISK PARAMETERS =====
risk:
  # Limite de inventar (USD)
  # Ajustate pentru ordine de $20
  max_inventory_usd: 100.0          # Max $100 expunere
  max_position_notional: 120.0      # Max $120 poziție notional
  max_leverage: 2.0                 # Leverage 2x

  # Kill switch - oprește botul
  # La $20 drawdown, oprește tot
  kill_switch_drawdown_usd: 20.0
  session_drawdown_pct: 15.0        # Sau 15% din balanță
  daily_drawdown_limit_usd: 25.0    # Limită zilnică
  
  # Tracking fills negative
  # Dacă 3+ fills negative în ultimele 5, reduce agresivitatea
  max_negative_fills_window: 5
  negative_fills_pause_threshold: 3
  
  # Inventory skew
  # Cât de mult să ajustăm quotes pe baza inventory
  inventory_skew_factor: 0.5

# ===== ORDER EXECUTION =====
order:
  # POST_ONLY - esențial pentru market making
  # Asigură că suntem mereu maker
  post_only: true
  
  # Nu folosim taker pentru risk-off pe testnet
  # Testăm doar logica de cotare
  use_taker_for_risk_off: false
  taker_offset_bps: 10.0
  
  # Expirare ordine (secunde)
  order_expiration_sec: 3600  # 1 oră
  
  # Cancel before replace
  cancel_before_replace: true
  
  # Retry pe erori
  max_retries: 3
  retry_delay_sec: 1.0

# =============================================================================
# SFATURI PENTRU TESTNET
# =============================================================================
# 1. Pornește ÎNTOTDEAUNA cu dry_run: false
# 2. Verifică logs pentru "Would create order" / "Would cancel"
# 3. După validarea logicii, setează dry_run: false
# 4. Monitorizează primele 10-15 minute activ
# 5. Verifică că spread-ul calculat are sens
# 6. Verifică că inventory skew funcționează corect
# =============================================================================
